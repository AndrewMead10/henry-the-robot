<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.5s ease;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .phase-label {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer-display {
            font-size: 12rem;
            font-weight: 300;
            color: white;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            line-height: 1;
            margin-bottom: 2rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .start-btn {
            background: white;
            color: #333;
        }

        .stop-btn {
            background: #ff6b6b;
            color: white;
        }

        .reset-btn {
            background: #4ecdc4;
            color: white;
        }

        .hidden {
            display: none;
        }

        /* Background colors based on time */
        .bg-idle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .bg-plenty {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .bg-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .bg-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

            </style>
</head>
<body class="bg-idle">
    <div class="container">
        <div class="phase-label" id="phaseLabel">Ready to Start?</div>
        <div class="timer-display" id="timerDisplay">3:00</div>
        <div class="button-group">
            <button class="btn start-btn" id="startBtn">Start Timer</button>
            <button class="btn stop-btn hidden" id="stopBtn">Stop</button>
            <button class="btn reset-btn hidden" id="resetBtn">Reset</button>
        </div>
    </div>

    <!-- Audio elements -->
    <audio id="audio1" src="presentation_over.mp3" preload="auto"></audio>
    <audio id="audio2" src="time_is_up.mp3" preload="auto"></audio>

    <script>
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const phaseLabel = document.getElementById('phaseLabel');
        const audio1 = document.getElementById('audio1');
        const audio2 = document.getElementById('audio2');
        const body = document.body;

        let timeRemaining = 0;
        let timerInterval = null;
        let currentPhase = 0; // 0 = idle, 1 = phase 1 (3 min), 2 = phase 2 (2 min)

        const PHASE_1_DURATION = 3 * 60; // 3 minutes in seconds
        const PHASE_2_DURATION = 2 * 60; // 2 minutes in seconds

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateBackground(seconds, totalSeconds) {
            const percentRemaining = seconds / totalSeconds;

            body.classList.remove('bg-idle', 'bg-plenty', 'bg-warning', 'bg-danger');

            if (percentRemaining > 0.5) {
                body.classList.add('bg-plenty');
            } else if (percentRemaining > 0.2) {
                body.classList.add('bg-warning');
            } else {
                body.classList.add('bg-danger');
            }
        }

        function startPhase(phase) {
            currentPhase = phase;

            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            resetBtn.classList.remove('hidden');

            if (phase === 1) {
                timeRemaining = PHASE_1_DURATION;
                phaseLabel.textContent = 'Phase 1';
            } else if (phase === 2) {
                timeRemaining = PHASE_2_DURATION;
                phaseLabel.textContent = 'Phase 2';
            }

            const totalSeconds = timeRemaining;
            timerDisplay.textContent = formatTime(timeRemaining);
            updateBackground(timeRemaining, totalSeconds);

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = formatTime(timeRemaining);
                updateBackground(timeRemaining, totalSeconds);

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    onPhaseComplete();
                }
            }, 1000);
        }

        function onPhaseComplete() {
            if (currentPhase === 1) {
                // Play first audio, then start phase 2
                phaseLabel.textContent = 'Phase 1 Complete!';
                audio1.play().catch(e => console.log('Audio 1 not loaded:', e));

                // Wait a moment then start phase 2
                setTimeout(() => {
                    startPhase(2);
                }, 2000);
            } else if (currentPhase === 2) {
                // Play second audio, timer complete
                phaseLabel.textContent = 'Complete!';
                audio2.play().catch(e => console.log('Audio 2 not loaded:', e));

                body.classList.remove('bg-plenty', 'bg-warning', 'bg-danger');
                body.classList.add('bg-idle');

                stopBtn.classList.add('hidden');
                resetBtn.classList.remove('hidden');
                currentPhase = 0;
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            currentPhase = 0;
            timeRemaining = PHASE_1_DURATION;

            audio1.pause();
            audio1.currentTime = 0;
            audio2.pause();
            audio2.currentTime = 0;

            timerDisplay.textContent = formatTime(PHASE_1_DURATION);
            phaseLabel.textContent = 'Ready to Start?';

            body.classList.remove('bg-plenty', 'bg-warning', 'bg-danger');
            body.classList.add('bg-idle');

            startBtn.classList.remove('hidden');
            startBtn.disabled = false;
            startBtn.textContent = 'Start Timer';
            stopBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;

            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            startBtn.disabled = false;
            startBtn.textContent = 'Resume';
        }

        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            resetBtn.classList.remove('hidden');

            if (currentPhase === 0) {
                startPhase(1);
            } else {
                // Resume existing phase
                const totalSeconds = currentPhase === 1 ? PHASE_1_DURATION : PHASE_2_DURATION;
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    timerDisplay.textContent = formatTime(timeRemaining);
                    updateBackground(timeRemaining, totalSeconds);

                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        onPhaseComplete();
                    }
                }, 1000);
            }
        });

        stopBtn.addEventListener('click', stopTimer);
        resetBtn.addEventListener('click', resetTimer);
    </script>
</body>
</html>
